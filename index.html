<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bug Bounty AI Agent</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        body { background-color: #131314; color: #e3e3e3; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
        pre { background: #1e1f20; padding: 12px; border-radius: 8px; overflow-x: auto; font-family: monospace; font-size: 13px; }
    </style>
</head>
<body class="h-screen flex flex-col justify-between">

    <!-- Auth Modal / Screen -->
    <div id="auth-modal" class="fixed inset-0 bg-black bg-opacity-80 flex items-center justify-center z-50">
        <div class="bg-[#1e1f20] p-6 rounded-2xl w-80 shadow-2xl border border-gray-800">
            <h2 class="text-lg font-semibold mb-4 text-center text-white">Enter Access Password</h2>
            <input type="password" id="password-input" placeholder="Password..." class="w-full bg-[#2d2e30] border border-gray-700 rounded-lg px-4 py-2 text-white focus:outline-none focus:border-blue-500 mb-4">
            <button onclick="savePassword()" class="w-full bg-blue-600 hover:bg-blue-700 text-white font-medium py-2 rounded-lg transition">Access Agent</button>
        </div>
    </div>

    <!-- Header -->
    <header class="border-b border-gray-800 p-4 flex justify-between items-center bg-[#131314]">
        <h1 class="text-lg font-semibold tracking-wide text-gray-200">🛡️ Local Bug Bounty Agent</h1>
        <button onclick="localStorage.removeItem('agent_pwd'); location.reload();" class="text-xs text-gray-400 hover:text-white bg-[#2d2e30] px-3 py-1.5 rounded-lg">Lock</button>
    </header>

    <!-- Chat Container -->
    <main id="chat-container" class="flex-1 overflow-y-auto p-4 md:p-6 space-y-6 max-w-4xl w-full mx-auto">
        <div class="flex items-start space-x-4">
            <div class="w-8 h-8 rounded-full bg-blue-600 flex items-center justify-center font-bold text-white shrink-0">AI</div>
            <div class="bg-[#1e1f20] p-4 rounded-2xl max-w-[85%] md:max-w-[75%] text-sm leading-relaxed border border-gray-800">
                Ready. Type your commands or queries (e.g., *Find subdomains for target.com*).
            </div>
        </div>
    </main>

    <!-- Input Footer -->
    <footer class="p-4 bg-[#131314] border-t border-gray-800">
        <div class="max-w-4xl mx-auto flex items-center bg-[#1e1f20] rounded-2xl border border-gray-700 px-4 py-2 focus-within:border-blue-500">
            <textarea id="user-input" rows="1" placeholder="Type a message..." class="flex-1 bg-transparent text-white focus:outline-none resize-none max-h-32 py-2 text-sm" onkeydown="handleKey(event)"></textarea>
            <button onclick="sendMessage()" class="ml-3 bg-blue-600 hover:bg-blue-700 text-white p-2.5 rounded-xl transition">
                <svg class="w-4 h-4 rotate-90" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 19l9 2-9-18-9 18 9-2zm0 0v-8"/></svg>
            </button>
        </div>
    </footer>

    <script>
        const BACKEND_URL = "https://chat.infinitumboxing.online/api/chat"; // Yahan apna tunnel URL ya subdomain dein

        function savePassword() {
            const pwd = document.getElementById('password-input').value;
            if(pwd) {
                localStorage.setItem('agent_pwd', pwd);
                document.getElementById('auth-modal').style.display = 'none';
            }
        }

        window.onload = function() {
            if(localStorage.getItem('agent_pwd')) {
                document.getElementById('auth-modal').style.display = 'none';
            }
        }

        function handleKey(e) {
            if(e.key === 'Enter' && !e.shiftKey) {
                e.preventDefault();
                sendMessage();
            }
        }

        async function sendMessage() {
            const input = document.getElementById('user-input');
            const prompt = input.value.trim();
            const password = localStorage.getItem('agent_pwd');

            if(!prompt || !password) return;

            input.value = '';
            appendMessage(prompt, 'user');

            // Loading bubble
            const loadingId = appendMessage("Thinking...", 'ai', true);

            try {
                const res = await fetch(BACKEND_URL, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ password, prompt })
                });

                const data = await res.json();
                removeMessage(loadingId);

                if(res.status === 401) {
                    alert("Incorrect Password!");
                    localStorage.removeItem('agent_pwd');
                    location.reload();
                    return;
                }

                appendMessage(data.response || "No response received.", 'ai');
            } catch (err) {
                removeMessage(loadingId);
                appendMessage("Error connecting to local backend tunnel: " + err.message, 'ai');
            }
        }

        function appendMessage(text, sender, isLoading = false) {
            const container = document.getElementById('chat-container');
            const id = 'msg-' + Date.now();
            const isUser = sender === 'user';

            const html = `
                <div id="${id}" class="flex items-start space-x-4 ${isUser ? 'flex-row-reverse space-x-reverse' : ''}">
                    <div class="w-8 h-8 rounded-full ${isUser ? 'bg-gray-700' : 'bg-blue-600'} flex items-center justify-center font-bold text-white shrink-0">
                        ${isUser ? 'U' : 'AI'}
                    </div>
                    <div class="${isUser ? 'bg-[#2b2d31] text-white' : 'bg-[#1e1f20] border border-gray-800 text-gray-200'} p-4 rounded-2xl max-w-[85%] md:max-w-[75%] text-sm leading-relaxed whitespace-pre-wrap">
                        ${text}
                    </div>
                </div>
            `;
            container.insertAdjacentHTML('beforeend', html);
            container.scrollTop = container.scrollHeight;
            return id;
        }

        function removeMessage(id) {
            const el = document.getElementById(id);
            if(el) el.remove();
        }
    </script>
</body>
</html>
