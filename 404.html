<!doctype html>
<html lang="en">
  <head>

    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="color-scheme" content="dark" />
    <meta name="referrer" content="no-referrer" />
    <title>Not found | ZAIN</title>
    <style>
      :root { color-scheme: dark; font-family: ui-monospace, SFMono-Regular, Menlo, monospace; background: #101310; color: #e7eadf; }

      body { min-height: 100vh; margin: 0; display: grid; place-items: center; padding: 24px; }
      main { width: min(100%, 620px); border-top: 1px solid #69744f; padding-top: 28px; }
      p { color: #aab29a; line-height: 1.7; }
      h1 { margin: 0; color: #d9f36a; font-size: clamp(72px, 18vw, 144px); line-height: .9; font-weight: 600; }
      a { display: inline-flex; margin-top: 18px; color: #101310; background: #d9f36a; padding: 12px 16px; text-decoration: none; font-weight: 700; }
      a:focus-visible { outline: 3px solid #fff; outline-offset: 4px; }
    </style>
  </head>
  <body>
    <main>
      <p>LOCAL AGENT / ROUTE NOT FOUND</p>
      <h1>404</h1>
      <p>This address does not exist. Return to the agent home.</p>

</html>
